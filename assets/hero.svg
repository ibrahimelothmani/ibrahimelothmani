<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ibrahim El Othmani, Cloud and DevOps Engineer</title>
  <desc id="desc">Animated banner with a terminal running terraform apply, kubectl get pods and argocd app sync.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0f1a33"/>
      <stop offset="1" stop-color="#0c2a3d"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
    <clipPath id="screen"><rect x="652" y="84" width="496" height="226"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 15px; }
    .whoami { font-size: 16px; fill: #22d3ee; letter-spacing: 1px; }
    .name { font-size: 50px; font-weight: 700; fill: #f0f6fc; letter-spacing: -0.5px; }
    .role { font-size: 24px; fill: #a5b8cf; }
    .chip rect { fill: #ffffff; fill-opacity: 0.05; stroke: #2f81f7; stroke-opacity: 0.55; }
    .chip text { font-size: 14px; fill: #cfe3ff; text-anchor: middle; }
    .title { font-size: 13px; fill: #6b7a90; text-anchor: middle; }
    .p { fill: #22d3ee; }
    .cmd { fill: #e6edf3; }
    .ok { fill: #3fb950; }
    .dim { fill: #8b9bb4; }
    .cover { fill: #0a0f1c; }

    /* background drift */
    .glow-a { animation: drift 14s ease-in-out infinite alternate; }
    .glow-b { animation: drift 18s ease-in-out infinite alternate-reverse; }
    @keyframes drift { to { transform: translate(70px, 30px); } }

    /* terminal: one 16s loop that starts on the finished screen (so a still frame shows real content),
       clears at ~9%, then retypes each command: covers slide right 9px per char */
    .screen { animation: screen 16s infinite; }
    @keyframes screen { 0%, 6% { opacity: 1; } 9%, 10% { opacity: 0; } 10.1%, 100% { opacity: 1; } }
    .l1 { animation: l1 16s infinite; } @keyframes l1 { 0%, 9.5% { opacity: 1; } 9.6%, 13.7% { opacity: 0; } 13.8%, 100% { opacity: 1; } }
    .l2 { animation: l2 16s infinite; } @keyframes l2 { 0%, 9.5% { opacity: 1; } 9.6%, 27.4% { opacity: 0; } 27.5%, 100% { opacity: 1; } }
    .l3 { animation: l3 16s infinite; } @keyframes l3 { 0%, 9.5% { opacity: 1; } 9.6%, 31.2% { opacity: 0; } 31.3%, 100% { opacity: 1; } }
    .l4 { animation: l4 16s infinite; } @keyframes l4 { 0%, 9.5% { opacity: 1; } 9.6%, 45.5% { opacity: 0; } 45.6%, 100% { opacity: 1; } }
    .l5 { animation: l5 16s infinite; } @keyframes l5 { 0%, 9.5% { opacity: 1; } 9.6%, 47.1% { opacity: 0; } 47.2%, 100% { opacity: 1; } }
    .l6 { animation: l6 16s infinite; } @keyframes l6 { 0%, 9.5% { opacity: 1; } 9.6%, 51.2% { opacity: 0; } 51.3%, 100% { opacity: 1; } }
    .l7 { animation: l7 16s infinite; } @keyframes l7 { 0%, 9.5% { opacity: 1; } 9.6%, 63.7% { opacity: 0; } 63.8%, 100% { opacity: 1; } }
    .l8 { animation: l8 16s infinite; } @keyframes l8 { 0%, 9.5% { opacity: 1; } 9.6%, 67.4% { opacity: 0; } 67.5%, 100% { opacity: 1; } }
    .c1 { transform: translateX(261px); animation: c1 16s steps(29) infinite; }
    @keyframes c1 { 0%, 9.5% { transform: translateX(261px); } 9.6%, 15.6% { transform: translateX(0); } 24.7%, 100% { transform: translateX(261px); } }
    .c3 { transform: translateX(270px); animation: c3 16s steps(30) infinite; }
    @keyframes c3 { 0%, 9.5% { transform: translateX(270px); } 9.6%, 33.1% { transform: translateX(0); } 42.5%, 100% { transform: translateX(270px); } }
    .c6 { transform: translateX(216px); animation: c6 16s steps(24) infinite; }
    @keyframes c6 { 0%, 9.5% { transform: translateX(216px); } 9.6%, 53.1% { transform: translateX(0); } 60.6%, 100% { transform: translateX(216px); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle class="glow-a" cx="240" cy="40" r="300" fill="url(#glowA)"/>
    <circle class="glow-b" cx="1000" cy="340" r="280" fill="url(#glowB)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text class="mono whoami" x="64" y="100">$ whoami</text>
  <text class="sans name" x="62" y="156">Ibrahim El Othmani</text>
  <rect x="64" y="174" width="140" height="4" rx="2" fill="url(#accent)"/>
  <text class="sans role" x="64" y="216">Cloud &amp; DevOps Engineer</text>
  <g class="chip sans">
    <rect x="64" y="240" width="104" height="30" rx="15"/><text x="116" y="260">Kubernetes</text>
    <rect x="178" y="240" width="96" height="30" rx="15"/><text x="226" y="260">Terraform</text>
    <rect x="284" y="240" width="60" height="30" rx="15"/><text x="314" y="260">AWS</text>
    <rect x="354" y="240" width="76" height="30" rx="15"/><text x="392" y="260">GitOps</text>
    <rect x="440" y="240" width="100" height="30" rx="15"/><text x="490" y="260">DevSecOps</text>
  </g>

  <g>
    <rect x="650" y="48" width="500" height="264" rx="12" fill="#0a0f1c" stroke="#24324f"/>
    <line x1="650" y1="82" x2="1150" y2="82" stroke="#24324f"/>
    <circle cx="672" cy="65" r="6" fill="#ff5f57"/>
    <circle cx="692" cy="65" r="6" fill="#febc2e"/>
    <circle cx="712" cy="65" r="6" fill="#28c840"/>
    <text class="mono title" x="900" y="70">ibrahim@platform: ~</text>
    <g clip-path="url(#screen)">
      <g class="mono screen">
        <g class="l1">
          <text class="p" x="670" y="110">$</text>
          <text class="cmd" x="688" y="110" textLength="261">terraform apply -auto-approve</text>
          <rect class="cover c1" x="688" y="95" width="265" height="20"/>
        </g>
        <text class="ok l2" x="670" y="135" textLength="423">Apply complete! Resources: 12 added, 0 changed.</text>
        <g class="l3">
          <text class="p" x="670" y="160">$</text>
          <text class="cmd" x="688" y="160" textLength="270">kubectl get pods -n production</text>
          <rect class="cover c3" x="688" y="145" width="274" height="20"/>
        </g>
        <text class="dim l4" y="185"><tspan x="670">api-gateway-6d9f</tspan><tspan x="841">1/1</tspan><tspan class="ok" x="895">Running</tspan></text>
        <text class="dim l5" y="210"><tspan x="670">worker-7c4b</tspan><tspan x="841">1/1</tspan><tspan class="ok" x="895">Running</tspan></text>
        <g class="l6">
          <text class="p" x="670" y="235">$</text>
          <text class="cmd" x="688" y="235" textLength="216">argocd app sync platform</text>
          <rect class="cover c6" x="688" y="220" width="220" height="20"/>
        </g>
        <text class="l7" x="670" y="260"><tspan class="ok">✓ Synced</tspan><tspan class="dim"> · </tspan><tspan class="ok">Healthy</tspan></text>
        <g class="l8">
          <text class="p" x="670" y="285">$</text>
          <rect class="cursor" x="688" y="272" width="9" height="17" fill="#e6edf3"/>
        </g>
      </g>
    </g>
  </g>
</svg>
